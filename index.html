<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Treino</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diário de Treino">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3D5A80">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#F1ECE1; --paper-line:#DCD3BE; --card:#FFFFFF;
    --ink:#2B2A26; --ink-soft:#6B675E;
    --steel:#3D5A80; --steel-dark:#2C4364; --rust:#A6402F;
    --rafael:#3D5A80; --amanda:#A6553D;
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0;
    background:var(--paper); border-bottom:1px solid var(--paper-line);
  }
  h1{ font-family:Georgia,"Times New Roman",serif; font-size:1.5rem; margin:0 0 2px; }
  header p{ margin:0 0 10px; font-size:.85rem; color:var(--ink-soft); }
  .status{ font-size:.72rem; color:var(--ink-soft); margin:-4px 0 10px; min-height:1.2em; }
  .status.err{ color:var(--rust); }
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; }
  .tab{
    flex:none; padding:8px 14px; border-radius:999px;
    border:1px solid var(--paper-line); background:var(--card);
    color:var(--ink-soft); font-size:.85rem; cursor:pointer; white-space:nowrap;
  }
  .tab.active{ background:var(--steel); border-color:var(--steel); color:#fff; }
  .tab-action{ border-style:dashed; color:var(--steel); }
  main{ max-width:520px; margin:0 auto; padding:16px 16px 100px; }
  .entry{
    background:var(--card); border:1px solid var(--paper-line);
    border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .entry-exercise{ font-size:1rem; font-weight:600; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .weights{ display:flex; gap:16px; }
  .weight-item{ font-size:.85rem; color:var(--ink-soft); }
  .weight-item b{ font-size:1rem; }
  .weight-item.rafael b{ color:var(--rafael); }
  .weight-item.amanda b{ color:var(--amanda); }
  .empty{ text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:.95rem; }
  .fab{
    position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:56px; height:56px; border-radius:50%;
    background:var(--steel); color:#fff; border:none; font-size:1.8rem;
    box-shadow:0 6px 16px rgba(0,0,0,.25); cursor:pointer; z-index:10;
  }
  .fab:disabled{ opacity:.5; cursor:not-allowed; }
  .sheet-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:20; }
  .sheet-backdrop.open{ display:block; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; background:var(--paper);
    border-radius:16px 16px 0 0; padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%); transition:transform .25s ease; z-index:21;
    max-height:85vh; overflow-y:auto;
  }
  .sheet.open{ transform:translateY(0); }
  .sheet h2{ margin:0 0 4px; font-size:1.1rem; font-family:Georgia,serif; }
  .sheet .cat-name{ font-size:.82rem; color:var(--ink-soft); margin-bottom:10px; }
  label{ display:block; font-size:.78rem; color:var(--ink-soft); margin:12px 0 4px; }
  input{
    width:100%; padding:10px 12px; border-radius:8px;
    border:1px solid var(--paper-line); background:var(--card);
    color:var(--ink); font-size:1rem;
  }
  input:focus{ outline:2px solid var(--steel); outline-offset:1px; }
  input.error{ border-color:var(--rust); }
  .error-msg{ color:var(--rust); font-size:.8rem; margin-top:6px; min-height:1.1em; }
  .weight-row{ display:flex; gap:10px; }
  .weight-row > div{ flex:1; }
  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{ flex:1; padding:12px; border-radius:8px; border:none; font-size:1rem; cursor:pointer; }
  .btn-primary{ background:var(--steel); color:#fff; }
  .btn-primary:disabled{ opacity:.6; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--paper-line); }
  .btn-danger{ background:transparent; color:var(--rust); border:1px solid var(--rust); flex:none; padding:12px 16px; }

  .attendance{ max-width:520px; margin:16px auto 0; padding:0 16px; }
  .att-card{ background:var(--card); border:1px solid var(--paper-line); border-radius:12px; padding:14px; }
  .att-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .person-tabs{ display:flex; gap:6px; }
  .person-tab{
    padding:6px 12px; border-radius:999px; font-size:.82rem; cursor:pointer;
    border:1px solid var(--paper-line); background:var(--paper); color:var(--ink-soft);
  }
  .person-tab.active.rafael{ background:var(--rafael); border-color:var(--rafael); color:#fff; }
  .person-tab.active.amanda{ background:var(--amanda); border-color:var(--amanda); color:#fff; }
  .week-nav{ display:flex; align-items:center; gap:8px; }
  .week-nav button{
    border:none; background:none; color:var(--ink-soft); font-size:1.1rem; cursor:pointer; padding:2px 4px;
  }
  .week-label{ font-size:.75rem; color:var(--ink-soft); white-space:nowrap; }
  .week-days{ display:flex; gap:6px; justify-content:space-between; }
  .day-cell{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 2px; border-radius:10px; cursor:pointer; border:1px solid transparent;
  }
  .day-cell .dow{ font-size:.68rem; color:var(--ink-soft); }
  .day-cell .num{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:.88rem; border:1px solid var(--paper-line); background:var(--paper);
  }
  .day-cell.today .num{ border-color:var(--steel); }
  .day-cell.marked.rafael .num{ background:var(--rafael); border-color:var(--rafael); color:#fff; }
  .day-cell.marked.amanda .num{ background:var(--amanda); border-color:var(--amanda); color:#fff; }
  .month-count{ margin-top:10px; font-size:.8rem; color:var(--ink-soft); text-align:center; }
  .month-count b{ color:var(--ink); }
  .delta{ font-size:.72rem; margin-top:2px; }
  .delta.up{ color:#3F7D4F; }
  .delta.down{ color:var(--rust); }
  .cat-pills{ display:flex; flex-direction:column; gap:8px; margin:4px 0 4px; }
  .cat-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-radius:10px; border:1px solid var(--paper-line);
    background:var(--card); cursor:pointer; font-size:.95rem;
  }
  .cat-row.active{ border-color:var(--steel); background:var(--steel); color:#fff; }
  .cat-row .check{ font-size:1rem; }
  .link-btn{ display:block; margin:10px auto 0; background:none; border:none; color:var(--steel); font-size:.82rem; cursor:pointer; text-decoration:underline; }
  .hist-month-nav{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:10px; }
  .hist-month-nav button{ border:none; background:none; color:var(--ink-soft); font-size:1.1rem; cursor:pointer; }
  .hist-month-nav span{ font-weight:600; text-transform:capitalize; }
  .hist-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:10px; max-width:280px; margin-left:auto; margin-right:auto; }
  .hist-day{ height:26px; display:flex; align-items:center; justify-content:center; border-radius:6px; font-size:.68rem; background:var(--paper); color:var(--ink-soft); }
  .hist-day.pad{ visibility:hidden; }
  .hist-day.marked.rafael{ background:var(--rafael); color:#fff; }
  .hist-day.marked.amanda{ background:var(--amanda); color:#fff; }
  .hist-total{ text-align:center; font-size:.85rem; margin-bottom:10px; }
  .hist-section-title{ font-size:.75rem; color:var(--ink-soft); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.03em; }
  .hist-cat-row{ display:flex; justify-content:space-between; font-size:.88rem; padding:7px 0; border-bottom:1px solid var(--paper-line); }
  .hist-group{ border:1px solid var(--paper-line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .hist-group-header{
    padding:9px 12px; background:var(--card); font-size:.85rem; font-weight:600;
  }
  .hist-ex-row{ padding:8px 12px; border-top:1px solid var(--paper-line); font-size:.82rem; background:var(--card); }
  .hist-ex-name{ font-weight:600; }
  .hist-ex-progress{ margin-top:2px; color:var(--ink-soft); }
  .hist-empty-note{ padding:8px 12px; border-top:1px solid var(--paper-line); font-size:.78rem; color:var(--ink-soft); background:var(--card); }

  .meas-table{ width:100%; border-collapse:collapse; font-size:.85rem; margin-bottom:12px; }
  .meas-table th{ text-align:center; padding:8px 4px; font-weight:600; border-bottom:1px solid var(--paper-line); }
  .meas-table th:first-child{ text-align:left; font-weight:500; color:var(--ink-soft); }
  .meas-table th.rafael{ color:var(--rafael); }
  .meas-table th.amanda{ color:var(--amanda); }
  .meas-table td{ text-align:center; padding:7px 4px; border-bottom:1px solid var(--paper-line); }
  .meas-table td:first-child{ text-align:left; color:var(--ink-soft); }
  .meas-table tr.total td{ font-weight:600; background:var(--card); }
  .meas-delta{ display:block; font-size:.68rem; color:var(--ink-soft); font-weight:400; }
  .meas-delta.up{ color:var(--rust); }
  .meas-delta.down{ color:#3F7D4F; }
  .meas-person-toggle{ display:flex; gap:6px; margin-bottom:12px; }
  .meas-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>
</head>
<body>
<header>
  <h1>Diário de Treino</h1>
  <div class="status" id="status"></div>
  <div class="tabs" id="tabs"></div>
</header>
<section class="attendance">
  <div class="att-card">
    <div class="att-top">
      <div class="person-tabs" id="personTabs"></div>
      <div class="week-nav">
        <button id="weekPrev" aria-label="Semana anterior">‹</button>
        <span class="week-label" id="weekLabel"></span>
        <button id="weekNext" aria-label="Próxima semana">›</button>
      </div>
    </div>

<div class="sheet-backdrop" id="measBackdrop"></div>
<div class="sheet" id="measSheet">

  <div class="hist-month-nav">

  </div>
  <table class="meas-table" id="measTable"></table>

    <button class="btn btn-ghost" id="measCloseBtn" style="flex:1;">Fechar</button>
  </div>
</div>

<div class="sheet-backdrop" id="measEntryBackdrop"></div>
<div class="sheet" id="measEntrySheet">
  <h2>Registrar medidas</h2>
  <div class="cat-name" id="measEntryMonthLabel"></div>
  <div class="meas-person-toggle" id="measEntryPersonToggle"></div>
  <div class="meas-grid">
    <div><label for="measPeso">Peso (kg)</label><input id="measPeso" type="number" inputmode="decimal"></div>
    <div><label for="measTriceps">Tríceps (mm)</label><input id="measTriceps" type="number" inputmode="decimal"></div>
    <div><label for="measSubescapular">Subescapular (mm)</label><input id="measSubescapular" type="number" inputmode="decimal"></div>
    <div><label for="measAxilar">Axilar média (mm)</label><input id="measAxilar" type="number" inputmode="decimal"></div>
    <div><label for="measPeitoral">Peitoral (mm)</label><input id="measPeitoral" type="number" inputmode="decimal"></div>
    <div><label for="measAbdominal">Abdominal (mm)</label><input id="measAbdominal" type="number" inputmode="decimal"></div>
    <div><label for="measSuprailiaca">Supra-ilíaca (mm)</label><input id="measSuprailiaca" type="number" inputmode="decimal"></div>
    <div><label for="measCoxa">Coxa (mm)</label><input id="measCoxa" type="number" inputmode="decimal"></div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="measEntryCancelBtn">Cancelar</button>

</div>

<div class="sheet-backdrop" id="histBackdrop"></div>
<div class="sheet" id="histSheet">
  <h2>Histórico mensal</h2>
  <div class="person-tabs" id="histPersonTabs" style="margin-bottom:12px;"></div>
  <div class="hist-month-nav">
    <button id="histMonthPrev">‹</button>
    <span id="histMonthLabel"></span>
    <button id="histMonthNext">›</button>
  </div>
  <div class="hist-grid" id="histGrid"></div>
  <div class="hist-total" id="histTotal"></div>
  <div class="hist-section-title">Treinos feitos</div>
  <div id="histCatList"></div>
  <div class="hist-section-title">Progresso de carga</div>
  <div id="histGroups"></div>
  <div class="sheet-actions" style="margin-top:16px;">
    <button class="btn btn-ghost" id="histCloseBtn" style="flex:1;">Fechar</button>
  </div>
</div>

<div class="sheet-backdrop" id="attBackdrop"></div>
<div class="sheet" id="attSheet">
  <h2 id="attSheetTitle">Treino do dia</h2>
  <div class="cat-name" id="attSheetDate"></div>
  <div class="cat-pills" id="attCatPills"></div>
  <div class="sheet-actions">
    <button class="btn-danger" id="attRemoveBtn" style="display:none;">Remover</button>
    <button class="btn btn-ghost" id="attCancelBtn">Cancelar</button>
    <button class="btn btn-primary" id="attSaveBtn">Salvar</button>

</div>
<main>
  <div id="list"></div>
</main>

<button class="fab" id="openBtn" aria-label="Adicionar exercício" disabled>+</button>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h2 id="sheetTitle">Novo exercício</h2>
  <div class="cat-name" id="sheetCat"></div>
  <label for="exercise">Exercício</label>
  <input id="exercise" type="text" placeholder="Ex: Supino reto" autocomplete="off">
  <div class="error-msg" id="errorMsg"></div>
  <div class="weight-row">
    <div>
      <label for="wRafael">Rafael (kg)</label>
      <input id="wRafael" type="number" inputmode="decimal" placeholder="Ex: 40">
    </div>
    <div>
      <label for="wAmanda">Amanda (kg)</label>
      <input id="wAmanda" type="number" inputmode="decimal" placeholder="Ex: 20">
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn-danger" id="deleteBtn" style="display:none;">Excluir</button>
    <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
    <button class="btn btn-primary" id="saveBtn">Salvar</button>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwwp7EFhZEHPNwpR_lTlAgbUq6XnEvQcgAschjItr9ZBRbG9SSqY7WTAj6x-lsl8JG-Nw/exec";
const POLL_MS = 6000;

const CATEGORIES = [
  {id:"costas-biceps", name:"Costas e Bíceps"},
  {id:"ombro-triceps", name:"Ombro e Tríceps"},
  {id:"perna", name:"Perna"},
  {id:"gluteo", name:"Glúteo"},
  {id:"peito", name:"Peito"},
];

let cache = {};
CATEGORIES.forEach(c => cache[c.id] = []);
cache._attendance = { rafael: {}, amanda: {} };
cache._measurements = { rafael: {}, amanda: {} };
const PERSON_INFO = {
  rafael: { label: "Rafael", sex: "M", birthdate: "2005-06-25" },
  amanda: { label: "Amanda", sex: "F", birthdate: "1999-05-14" }
};
const MEAS_FIELDS = [
  { id: "peso", label: "Peso", unit: "kg" },
  { id: "triceps", label: "Tríceps", unit: "mm" },
  { id: "subescapular", label: "Subescapular", unit: "mm" },
  { id: "axilar", label: "Axilar média", unit: "mm" },
  { id: "peitoral", label: "Peitoral", unit: "mm" },
  { id: "abdominal", label: "Abdominal", unit: "mm" },
  { id: "suprailiaca", label: "Supra-ilíaca", unit: "mm" },
  { id: "coxa", label: "Coxa", unit: "mm" }
];
function ageOf(person, refDate){
  const ref = refDate || new Date();
  const [by,bm,bd] = PERSON_INFO[person].birthdate.split("-").map(Number);
  let age = ref.getFullYear() - by;
  if(ref.getMonth()+1 < bm || (ref.getMonth()+1 === bm && ref.getDate() < bd)) age--;
  return age;
}
function bodyFatPercent(person, m){
  const skinfoldIds = ["triceps", "subescapular", "axilar", "peitoral", "abdominal", "suprailiaca", "coxa"];
  const values = skinfoldIds.map(id => parseFloat(m[id]));
  if (values.some(v => isNaN(v))) return null;
  const sumMm = values.reduce((a, b) => a + b, 0);
  const age = ageOf(person);
  let density;
  if (PERSON_INFO[person].sex === "M") {
    density = 1.112 - (0.00043499 * sumMm) + (0.00000055 * sumMm * sumMm) - (0.00028826 * age);
  } else {
    density = 1.097 - (0.00046971 * sumMm) + (0.00000056 * sumMm * sumMm) - (0.00012828 * age);
  }
  const pct = (495 / density) - 450;
  return Math.round(pct * 10) / 10;
}
function monthKeyOf(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function maybeShowMonthlySummary(){
  const curKey = monthKeyOf(new Date());
  let lastShown = null;
  try{ lastShown = localStorage.getItem("lastSummaryMonthShown"); }catch(e){}
  if(lastShown === curKey) return;
  try{ localStorage.setItem("lastSummaryMonthShown", curKey); }catch(e){}
  const prev = new Date();
  prev.setDate(1);
  prev.setMonth(prev.getMonth()-1);
  openHistSheetAction(prev);
}
let attEditingDate = null;
let attSelectedCats = new Set();
let activeCat = CATEGORIES[0].id;
let editingId = null;
let lastSyncOk = false;
let activePerson = "rafael";
let weekStart = startOfWeek(new Date());
let initialLoadDone = false;
let everHadData = false;

function hasAnyData(){
  const hasExercise = CATEGORIES.some(c => cache[c.id].length > 0);
  const hasAtt = Object.keys(cache._attendance.rafael).length > 0 || Object.keys(cache._attendance.amanda).length > 0;
  const hasMeas = Object.keys(cache._measurements.rafael).length > 0 || Object.keys(cache._measurements.amanda).length > 0;
  return hasExercise || hasAtt || hasMeas;
}

function startOfWeek(d){
  const r = new Date(d);
  r.setHours(0,0,0,0);
  r.setDate(r.getDate() - r.getDay());
  return r;
}
function dateKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

const tabsEl = document.getElementById("tabs");
const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");
const sheet = document.getElementById("sheet");
const backdrop = document.getElementById("backdrop");
const exerciseInput = document.getElementById("exercise");
const wRafaelInput = document.getElementById("wRafael");
const wAmandaInput = document.getElementById("wAmanda");
const errorMsg = document.getElementById("errorMsg");
const deleteBtn = document.getElementById("deleteBtn");
const saveBtn = document.getElementById("saveBtn");
const personTabsEl = document.getElementById("personTabs");
const weekDaysEl = document.getElementById("weekDays");
const weekLabelEl = document.getElementById("weekLabel");
const monthCountEl = document.getElementById("monthCount");
const attBackdrop = document.getElementById("attBackdrop");
const attSheet = document.getElementById("attSheet");

function catShort(id){
  return { "costas-biceps":"Costas/Bíceps", "ombro-triceps":"Ombro/Tríceps", "perna":"Perna", "gluteo":"Glúteo", "peito":"Peito" }[id] || id;
}

function normalizePersonAtt(v){
  if(Array.isArray(v)){
    const obj = {};
    v.forEach(dateStr => { obj[dateStr] = []; });
    return obj;
  }
  if(v && typeof v === "object") return v;
  return {};
}

function catName(id){ return CATEGORIES.find(c => c.id === id).name; }
function normalize(s){ return s.trim().toLowerCase(); }

function isDuplicate(name, excludeId){
  const n = normalize(name);
  return cache[activeCat].some(ex => ex.id !== excludeId && normalize(ex.name) === n);
}

function setStatus(msg, isErr){
  statusEl.textContent = msg || "";
  statusEl.classList.toggle("err", !!isErr);
}

async function fetchRemote(){
  try{
    const res = await fetch(WEB_APP_URL, { method: "GET" });
    if(!res.ok) throw new Error("http " + res.status);
    const data = await res.json();
    CATEGORIES.forEach(c => { cache[c.id] = Array.isArray(data[c.id]) ? data[c.id] : []; });
    const att = data._attendance || {};
    cache._attendance = {
      rafael: normalizePersonAtt(att.rafael),
      amanda: normalizePersonAtt(att.amanda)
    };
    const meas = data._measurements || {};
    cache._measurements = {
      rafael: (meas.rafael && typeof meas.rafael === "object") ? meas.rafael : {},
      amanda: (meas.amanda && typeof meas.amanda === "object") ? meas.amanda : {}
    };
    lastSyncOk = true;
    initialLoadDone = true;
    if(hasAnyData()) everHadData = true;
    openBtn.disabled = false;
    setStatus("");
    render();
    renderAttendance();
    if(backfillMissingHistory()) pushRemote();
    maybeShowMonthlySummary();
  }catch(e){
    lastSyncOk = false;
    setStatus("Sem conexão com a planilha agora. Mostrando os últimos dados carregados.", true);
  }
}

async function pushRemote(){
  if(!initialLoadDone){
    setStatus("Ainda carregando os dados — aguarde um instante antes de editar.", true);
    return;
  }
  if(everHadData && !hasAnyData()){
    setStatus("Ação bloqueada por segurança: isso apagaria todos os dados. Recarregue a página e tente de novo.", true);
    return;
  }
  try{
    await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(cache)
    });
    lastSyncOk = true;
  }catch(e){
    lastSyncOk = false;
    setStatus("Não consegui salvar agora. Confira sua internet e tente de novo.", true);
  }
}

function openSheet(editEntry){
  errorMsg.textContent = "";
  exerciseInput.classList.remove("error");
  document.getElementById("sheetCat").textContent = catName(activeCat);
  if(editEntry){
    editingId = editEntry.id;
    document.getElementById("sheetTitle").textContent = "Editar exercício";
    exerciseInput.value = editEntry.name;
    wRafaelInput.value = editEntry.rafael || "";
    wAmandaInput.value = editEntry.amanda || "";
    deleteBtn.style.display = "block";
  } else {
    editingId = null;
    document.getElementById("sheetTitle").textContent = "Novo exercício";
    exerciseInput.value = "";
    wRafaelInput.value = "";
    wAmandaInput.value = "";
    deleteBtn.style.display = "none";
  }
  backdrop.classList.add("open");
  sheet.classList.add("open");
  setTimeout(()=>exerciseInput.focus(), 250);
}
function closeSheet(){
  backdrop.classList.remove("open");
  sheet.classList.remove("open");
}

document.getElementById("openBtn").onclick = () => openSheet(null);
document.getElementById("cancelBtn").onclick = closeSheet;
backdrop.onclick = closeSheet;

saveBtn.onclick = async () => {
  const name = exerciseInput.value.trim();
  if(!name){
    exerciseInput.classList.add("error");
    errorMsg.textContent = "Digite o nome do exercício.";
    exerciseInput.focus();
    return;
  }
  if(isDuplicate(name, editingId)){
    exerciseInput.classList.add("error");
    errorMsg.textContent = "Já existe um exercício com esse nome nesse treino.";
    exerciseInput.focus();
    return;
  }
  exerciseInput.classList.remove("error");
  const rafael = wRafaelInput.value.trim();
  const amanda = wAmandaInput.value.trim();
  let ex;
  if(editingId){
    ex = cache[activeCat].find(e => e.id === editingId);
    ex.name = name; ex.rafael = rafael; ex.amanda = amanda;
  } else {
    ex = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name, rafael, amanda, history: [] };
    cache[activeCat].unshift(ex);
  }
  recordHistory(ex);
  saveBtn.disabled = true;
  setStatus("Salvando…");
  render();
  closeSheet();
  await pushRemote();
  saveBtn.disabled = false;
  setStatus(lastSyncOk ? "" : "Não consegui salvar agora. Confira sua internet e tente de novo.", !lastSyncOk);
};

deleteBtn.onclick = async () => {
  cache[activeCat] = cache[activeCat].filter(e => e.id !== editingId);
  setStatus("Salvando…");
  render();
  closeSheet();
  await pushRemote();
  setStatus(lastSyncOk ? "" : "Não consegui salvar agora. Confira sua internet e tente de novo.", !lastSyncOk);
};

function recordHistory(ex){
  const today = dateKey(new Date());
  if(!Array.isArray(ex.history)) ex.history = [];
  const todayEntry = ex.history.find(h => h.date === today);
  if(todayEntry){ todayEntry.rafael = ex.rafael; todayEntry.amanda = ex.amanda; }
  else ex.history.push({date: today, rafael: ex.rafael, amanda: ex.amanda});
}

function backfillMissingHistory(){
  let changed = false;
  CATEGORIES.forEach(c => {
    cache[c.id].forEach(ex => {
      if(!Array.isArray(ex.history) || ex.history.length === 0){
        recordHistory(ex);
        changed = true;
      }
    });
  });
  return changed;
}

function weightDelta(ex, person){
  if(!Array.isArray(ex.history) || ex.history.length < 2) return null;
  const sorted = [...ex.history].sort((a,b)=> a.date.localeCompare(b.date));
  const curr = parseFloat(sorted[sorted.length-1][person]);
  const prev = parseFloat(sorted[sorted.length-2][person]);
  if(isNaN(curr) || isNaN(prev) || curr === prev) return null;
  return curr - prev;
}

function renderTabs(){
  tabsEl.innerHTML = "";
  CATEGORIES.forEach(c => {
    const el = document.createElement("button");
    el.className = "tab" + (c.id === activeCat ? " active" : "");
    el.textContent = c.name;
    el.onclick = () => { activeCat = c.id; render(); };
    tabsEl.appendChild(el);
  });
  const histBtn = document.createElement("button");
  histBtn.className = "tab tab-action";
  histBtn.textContent = "Histórico";
  histBtn.onclick = () => openHistSheetAction();
  tabsEl.appendChild(histBtn);
  const measBtn = document.createElement("button");
  measBtn.className = "tab tab-action";
  measBtn.textContent = "Medidas";
  measBtn.onclick = () => openMeasSheetAction();
  tabsEl.appendChild(measBtn);
}

function render(){
  renderTabs();
  const list = cache[activeCat];
  if(list.length === 0){
    listEl.innerHTML = '<div class="empty">Nenhum exercício em ' + escapeHtml(catName(activeCat)) + ' ainda.<br>Toque em + para adicionar.</div>';
    return;
  }
  listEl.innerHTML = "";
  list.forEach(e => {
    const row = document.createElement("div");
    row.className = "entry";
    const dR = weightDelta(e, "rafael");
    const dA = weightDelta(e, "amanda");
    const deltaHtml = (d) => d === null ? "" :
      `<div class="delta ${d>0?"up":"down"}">${d>0?"+":""}${d}kg</div>`;
    row.innerHTML = `
      <div class="entry-exercise">${escapeHtml(e.name)}</div>
      <div class="weights">
        <div class="weight-item rafael">Rafael<br><b>${e.rafael ? escapeHtml(e.rafael) + " kg" : "—"}</b>${deltaHtml(dR)}</div>
        <div class="weight-item amanda">Amanda<br><b>${e.amanda ? escapeHtml(e.amanda) + " kg" : "—"}</b>${deltaHtml(dA)}</div>
      </div>
    `;
    row.onclick = () => openSheet(e);
    listEl.appendChild(row);
  });
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function renderPersonTabs(){
  personTabsEl.innerHTML = "";
  [["rafael","Rafael"],["amanda","Amanda"]].forEach(([id,label]) => {
    const el = document.createElement("button");
    el.className = "person-tab " + id + (activePerson === id ? " active" : "");
    el.textContent = label;
    el.onclick = () => { activePerson = id; renderAttendance(); };
    personTabsEl.appendChild(el);
  });
}

function openAttSheet(d){
  attEditingDate = dateKey(d);
  const existing = cache._attendance[activePerson][attEditingDate];
  attSelectedCats = new Set(existing || []);
  document.getElementById("attSheetTitle").textContent = "Treino de " + (activePerson==="rafael"?"Rafael":"Amanda");
  document.getElementById("attSheetDate").textContent = d.toLocaleDateString("pt-BR", {weekday:"long", day:"2-digit", month:"long"});
  renderAttCatPills();
  document.getElementById("attRemoveBtn").style.display = existing ? "block" : "none";
  attBackdrop.classList.add("open");
  attSheet.classList.add("open");

function closeAttSheet(){
  attBackdrop.classList.remove("open");
  attSheet.classList.remove("open");
}
function renderAttCatPills(){
  const el = document.getElementById("attCatPills");
  el.innerHTML = "";
  CATEGORIES.forEach(c => {
    const active = attSelectedCats.has(c.id);
    const row = document.createElement("div");
    row.className = "cat-row" + (active ? " active" : "");
    row.innerHTML = `<span>${escapeHtml(c.name)}</span><span class="check">${active ? "✓" : ""}</span>`;
    row.onclick = () => {
      if(active) attSelectedCats.delete(c.id);
      else attSelectedCats.add(c.id);
      renderAttCatPills();
    };
    el.appendChild(row);
  });
}
document.getElementById("attCancelBtn").onclick = closeAttSheet;
attBackdrop.onclick = closeAttSheet;
document.getElementById("attSaveBtn").onclick = async () => {
  if(attSelectedCats.size === 0) delete cache._attendance[activePerson][attEditingDate];
  else cache._attendance[activePerson][attEditingDate] = Array.from(attSelectedCats);
  closeAttSheet();
  renderAttendance();
  await pushRemote();
};
document.getElementById("attRemoveBtn").onclick = async () => {
  delete cache._attendance[activePerson][attEditingDate];
  closeAttSheet();
  renderAttendance();
  await pushRemote();
};

function renderAttendance(){
  renderPersonTabs();
  const DOW = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const today = new Date();
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate()+i);
    days.push(d);
  }
  const endOfWeek = days[6];
  const sameMonth = weekStart.getMonth() === endOfWeek.getMonth();
  weekLabelEl.textContent = sameMonth
    ? weekStart.getDate() + "–" + endOfWeek.getDate() + " " + endOfWeek.toLocaleDateString("pt-BR",{month:"short"})
    : weekStart.getDate() + " " + weekStart.toLocaleDateString("pt-BR",{month:"short"}) + " – " + endOfWeek.getDate() + " " + endOfWeek.toLocaleDateString("pt-BR",{month:"short"});

  weekDaysEl.innerHTML = "";
  days.forEach(d => {
    const key = dateKey(d);
    const cats = cache._attendance[activePerson][key];
    const marked = Object.prototype.hasOwnProperty.call(cache._attendance[activePerson], key);
    const cell = document.createElement("div");
    cell.className = "day-cell" + (sameDay(d,today) ? " today" : "") + (marked ? " marked " + activePerson : "");
    cell.title = marked ? (Array.isArray(cats) && cats.length ? cats.map(catShort).join(", ") : "Treino registrado") : "";
    cell.innerHTML = `<div class="dow">${DOW[d.getDay()]}</div><div class="num">${d.getDate()}</div>`;
    cell.onclick = () => openAttSheet(d);
    weekDaysEl.appendChild(cell);
  });

  const refMonth = endOfWeek.getMonth(), refYear = endOfWeek.getFullYear();
  const att = cache._attendance[activePerson];
  const count = Object.keys(att).filter(k => {
    const [y,m] = k.split("-").map(Number);
    return y === refYear && m === refMonth + 1;
  }).length;
  const monthName = endOfWeek.toLocaleDateString("pt-BR",{month:"long"});
  const personLabel = activePerson === "rafael" ? "Rafael" : "Amanda";
  monthCountEl.innerHTML = personLabel + ": <b>" + count + " dia" + (count===1?"":"s") + "</b> em " + monthName;
}

const histBackdrop = document.getElementById("histBackdrop");

  histMonth = month || new Date();

  histBackdrop.classList.add("open");
  histSheet.classList.add("open");

document.getElementById("histMonthPrev").onclick = () => { histMonth.setMonth(histMonth.getMonth()-1); renderHist(); };
document.getElementById("histMonthNext").onclick = () => { histMonth.setMonth(histMonth.getMonth()+1); renderHist(); };

function renderHist(){
  const tabsHolder = document.getElementById("histPersonTabs");
  tabsHolder.innerHTML = "";
  [["rafael","Rafael"],["amanda","Amanda"]].forEach(([id,label]) => {
    const b = document.createElement("button");
    b.className = "person-tab " + id + (histPerson === id ? " active" : "");
    b.textContent = label;
    b.onclick = () => { histPerson = id; renderHist(); };
    tabsHolder.appendChild(b);
  });

  const year = histMonth.getFullYear(), month = histMonth.getMonth();
  document.getElementById("histMonthLabel").textContent = histMonth.toLocaleDateString("pt-BR",{month:"long", year:"numeric"});

  const grid = document.getElementById("histGrid");
  grid.innerHTML = "";
  const firstDay = new Date(year, month, 1);
  const startPad = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  for(let i=0;i<startPad;i++){
    const pad = document.createElement("div");
    pad.className = "hist-day pad";
    grid.appendChild(pad);
  }
  const att = cache._attendance[histPerson];
  const catCounts = {};
  CATEGORIES.forEach(c => catCounts[c.id] = 0);
  let totalDays = 0;
  const mm = String(month+1).padStart(2,"0");
  for(let day=1; day<=daysInMonth; day++){
    const key = year + "-" + mm + "-" + String(day).padStart(2,"0");
    const marked = Object.prototype.hasOwnProperty.call(att, key);
    const cell = document.createElement("div");
    cell.className = "hist-day" + (marked ? " marked " + histPerson : "");
    cell.textContent = day;
    grid.appendChild(cell);
    if(marked){
      totalDays++;
      const cats = att[key];
      if(Array.isArray(cats)) cats.forEach(cid => { if(catCounts[cid] !== undefined) catCounts[cid]++; });
    }
  }
  const monthNameOnly = histMonth.toLocaleDateString("pt-BR",{month:"long"});
  document.getElementById("histTotal").innerHTML = "<b>" + totalDays + "</b> dia" + (totalDays===1?"":"s") + " treinados em " + monthNameOnly;

  const catListEl = document.getElementById("histCatList");
  catListEl.innerHTML = "";
  CATEGORIES.forEach(c => {
    const row = document.createElement("div");
    row.className = "hist-cat-row";
    row.innerHTML = `<span>${escapeHtml(c.name)}</span><span>${catCounts[c.id]}x</span>`;
    catListEl.appendChild(row);
  });

  const groupsEl = document.getElementById("histGroups");
  groupsEl.innerHTML = "";
  const monthStart = year + "-" + mm + "-01";
  const monthEnd = year + "-" + mm + "-31";
  let anyGroup = false;
  CATEGORIES.forEach(c => {
    if(catCounts[c.id] === 0) return;
    anyGroup = true;
    const group = document.createElement("div");
    group.className = "hist-group";
    group.innerHTML = `<div class="hist-group-header">${escapeHtml(c.name)}</div>`;
    let anyEx = false;
    cache[c.id].forEach(ex => {
      if(!Array.isArray(ex.history) || ex.history.length === 0) return;
      const sorted = [...ex.history].sort((a,b) => a.date.localeCompare(b.date));
      const inMonth = sorted.filter(h => h.date >= monthStart && h.date <= monthEnd);
      if(inMonth.length === 0) return;
      const before = sorted.filter(h => h.date < monthStart);
      const startEntry = before.length ? before[before.length-1] : inMonth[0];
      const endEntry = inMonth[inMonth.length-1];
      const parts = ["rafael","amanda"].map(p => {
        const sv = parseFloat(startEntry[p]), ev = parseFloat(endEntry[p]);
        if(isNaN(sv) || isNaN(ev)) return null;
        const d = Math.round((ev-sv)*10)/10;
        const label = p === "rafael" ? "Rafael" : "Amanda";
        if(d === 0) return label + ": " + ev + "kg (sem variação)";
        return label + ": " + sv + "kg → " + ev + "kg (" + (d>0?"+":"") + d + "kg)";
      }).filter(Boolean);
      if(parts.length === 0) return;
      anyEx = true;
      const row = document.createElement("div");
      row.className = "hist-ex-row";
      row.innerHTML = `<div class="hist-ex-name">${escapeHtml(ex.name)}</div><div class="hist-ex-progress">${parts.join(" &nbsp;|&nbsp; ")}</div>`;
      group.appendChild(row);
    });
    if(!anyEx){
      const note = document.createElement("div");
      note.className = "hist-empty-note";
      note.textContent = "Sem peso registrado nesse treino esse mês.";
      group.appendChild(note);
    }
    groupsEl.appendChild(group);
  });
  if(!anyGroup){
    groupsEl.innerHTML = '<div class="empty" style="padding:16px 0;">Nenhum treino registrado nesse mês ainda.</div>';
  }
}

}

measBackdrop.onclick = closeMeas;
document.getElementById("measMonthPrev").onclick = () => { measMonth.setMonth(measMonth.getMonth()-1); renderMeas(); };
document.getElementById("measMonthNext").onclick = () => { measMonth.setMonth(measMonth.getMonth()+1); renderMeas(); };

function prevRecordedMonth(person, beforeKey){
  const keys = Object.keys(cache._measurements[person]).filter(k => k < beforeKey).sort();
  return keys.length ? keys[keys.length-1] : null;
}

function renderMeas(){
  document.getElementById("measMonthLabel").textContent = measMonth.toLocaleDateString("pt-BR",{month:"long", year:"numeric"});
  const key = monthKeyOf(measMonth);
  const table = document.getElementById("measTable");
  const rMeas = cache._measurements.rafael[key];
  const aMeas = cache._measurements.amanda[key];
  const rPrevKey = prevRecordedMonth("rafael", key);
  const aPrevKey = prevRecordedMonth("amanda", key);
  const rPrev = rPrevKey ? cache._measurements.rafael[rPrevKey] : null;
  const aPrev = aPrevKey ? cache._measurements.amanda[aPrevKey] : null;

  function cell(curr, prev, unit){
    if(!curr || curr === undefined) return "—";
    const v = curr;
    let deltaHtml = "";
    if(prev){
      const d = Math.round((parseFloat(v) - parseFloat(prev))*10)/10;
      if(!isNaN(d) && d !== 0){
        deltaHtml = `<span class="meas-delta ${d>0?"up":"down"}">${d>0?"+":""}${d}</span>`;
      }
    }
    return escapeHtml(String(v)) + unit + deltaHtml;
  }

  let rows = "<tr><th></th><th class=\"rafael\">Rafael</th><th class=\"amanda\">Amanda</th></tr>";
  MEAS_FIELDS.forEach(f => {
    const rv = rMeas ? rMeas[f.id] : null;
    const av = aMeas ? aMeas[f.id] : null;
    const pr = rPrev ? rPrev[f.id] : null;
    const pa = aPrev ? aPrev[f.id] : null;
    rows += `<tr><td>${f.label}</td><td>${cell(rv, pr, f.unit)}</td><td>${cell(av, pa, f.unit)}</td></tr>`;
  });
  const rFat = rMeas ? bodyFatPercent("rafael", rMeas) : null;
  const aFat = aMeas ? bodyFatPercent("amanda", aMeas) : null;
  rows += `<tr class="total"><td>% gordura estimado</td><td>${rFat !== null ? rFat+"%" : "—"}</td><td>${aFat !== null ? aFat+"%" : "—"}</td></tr>`;
  table.innerHTML = rows;
}

document.getElementById("weekNext").onclick = () => {

renderAttendance();
setStatus("Carregando…");
fetchRemote();
setInterval(fetchRemote, POLL_MS);
